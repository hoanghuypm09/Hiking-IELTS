<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Học IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: notebook-style study app. Unit rail on the left (top row on phones), one working area with skill tabs. */
:root{
  --paper:#F4F6FA; --sheet:#FFFFFF; --ink:#16213A; --muted:#5A6580; --line:#DCE1EB;
  --accent:#1D6A73; --accent-ink:#FFFFFF; --accent-soft:#E2F0F1;
  --mark:#FFE47A; --mark-ink:#16213A; --c3:#C9792B;
  --ok:#1E7B46; --ok-soft:#E3F3E9; --bad:#B23A3A; --bad-soft:#F8E4E4;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro","Noto Sans","Segoe UI",system-ui,sans-serif;
  --ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1320; --sheet:#161D2E; --ink:#E6EAF3; --muted:#9AA4BD; --line:#2A3348;
  --accent:#5BBEC8; --accent-ink:#0B1A1C; --accent-soft:#17323A;
  --mark:#5E5014; --mark-ink:#FFF3C4; --c3:#E6A35E;
  --ok:#6FD39A; --ok-soft:#163626; --bad:#F08A8A; --bad-soft:#3A1C1C; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1320; --sheet:#161D2E; --ink:#E6EAF3; --muted:#9AA4BD; --line:#2A3348;
  --accent:#5BBEC8; --accent-ink:#0B1A1C; --accent-soft:#17323A;
  --mark:#5E5014; --mark-ink:#FFF3C4; --c3:#E6A35E;
  --ok:#6FD39A; --ok-soft:#163626; --bad:#F08A8A; --bad-soft:#3A1C1C; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .2em;border-radius:3px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{border-bottom:1px solid var(--line);background:var(--sheet)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-weight:800;font-size:1.25rem}
.brand span{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top .spacer{flex:1}
.pill{font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}

.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:24px 48px}
.rail{display:flex;flex-direction:column;gap:4px}
.rail .label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.unit-btn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:8px 12px;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer}
.unit-btn small{color:var(--muted);font-size:.76rem}
.unit-btn:hover{background:var(--sheet);border-color:var(--line)}
.unit-btn[aria-current="true"]{background:var(--sheet);border-color:var(--accent)}
.unit-btn .bar{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.unit-btn .bar i{display:block;height:100%;background:var(--accent)}
.unit-btn.rev{padding:5px 12px;font-size:.82rem;color:var(--muted);border-style:dashed;border-color:var(--line)}
.unit-btn.rev[aria-current="true"]{color:var(--ink);border-color:var(--accent)}
main{min-width:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .done{color:var(--ok);margin-left:4px}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--sheet);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.85rem}
.book{display:flex;gap:10px;align-items:baseline;font-size:.86rem;padding:8px 12px;border-radius:8px;background:var(--accent-soft);margin-bottom:16px}
.book b{white-space:nowrap;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}

/* home */
.hero{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.hero p{max-width:66ch;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ucard{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;padding:18px}
.ucard:hover{border-color:var(--accent)}
.ucard h2{font-size:1.2rem}
.dots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.dot{font-size:.66rem;text-align:center;padding:3px 0;border-radius:6px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.dot.on{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.revrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.exam{margin-top:28px}
.exam table,.dtable{width:100%;border-collapse:collapse;font-size:.9rem}
.exam th,.exam td,.dtable th,.dtable td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.exam th,.dtable th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dtable td{font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* vocab */
.flash-area{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.card{perspective:1000px;min-height:240px;cursor:pointer;border:0;background:none;padding:0;text-align:left;width:100%}
.card-in{position:relative;width:100%;height:100%;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:var(--sheet);padding:22px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.word{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.1}
.ipa{font-family:var(--ipa);color:var(--muted)}
.pos{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);align-self:flex-start;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin-top:auto}
.wordlist{display:flex;flex-direction:column;max-height:520px;overflow:auto}
.wl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.wl:last-child{border-bottom:0}
.wl b{font-weight:600}
.tick{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
@media (prefers-reduced-motion:reduce){.card-in{transition:none}}

/* quiz */
.qhead{font-weight:600;padding:14px 0 4px;border-bottom:1px solid var(--line)}
.qhead:first-child{padding-top:0}
.q{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.q .num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.col{flex-direction:column;align-items:flex-start}
.opt{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--sheet)}
.opt input{accent-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.gapline{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.gap{border:0;border-bottom:2px solid var(--line);background:transparent;padding:2px 4px;width:150px;max-width:100%}
.gap:focus{border-bottom-color:var(--accent);outline:none}
.gap.right{border-bottom-color:var(--ok)} .gap.wrong{border-bottom-color:var(--bad)}
.pick-sel{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--sheet);max-width:100%}
.pick-sel.right{border-color:var(--ok);background:var(--ok-soft)} .pick-sel.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fix{font-size:.85rem;font-weight:600}
.fix.ok{color:var(--ok)} .fix.no{color:var(--bad)}
.explain{font-size:.88rem;padding:8px 12px;border-radius:8px;background:var(--paper)}
.score{font-family:var(--display);font-weight:800;font-size:1.3rem}
.score.good{color:var(--ok)} .score.low{color:var(--bad)}
.fig{margin:8px 0}
.fig svg{width:100%;max-width:440px;height:auto}
.fig text{fill:var(--ink);font-family:var(--body);font-size:13px}

/* grammar */
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.rule .sheet{padding:16px}
.rule ul{margin:6px 0 0;padding-left:18px}
.ex{font-style:italic}

/* reading */
.reading{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.passage{max-width:65ch}
.passage p{margin-bottom:12px}
.passage p .pn{font-weight:700;color:var(--accent);margin-right:6px;font-family:var(--display)}
.sticky{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}

/* listening */
.script{font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.script .sp{font-weight:700;color:var(--accent);margin-right:6px}
.script .now{background:var(--mark);color:var(--mark-ink);border-radius:4px}
select.rate{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--sheet)}

/* writing */
.task{border-left:4px solid var(--ink);padding:4px 0 4px 14px}
textarea{width:100%;min-height:280px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--sheet);resize:vertical;line-height:1.7}
.wc{font-variant-numeric:tabular-nums;font-weight:600}
.wc.low{color:var(--bad)} .wc.ok{color:var(--ok)}
.check label{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.model{white-space:pre-line;background:var(--paper);border-radius:10px;padding:16px;max-width:70ch}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;align-items:start}
.chart h4{margin:0 0 6px;font-size:.88rem;font-weight:600}
.chart svg{width:100%;height:auto;max-width:560px}
.chart text{fill:var(--ink);font-family:var(--body);font-size:12px}
.chart .grid{stroke:var(--line)}
.process{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.process span.step{border:1px solid var(--ink);border-radius:8px;padding:8px 10px;max-width:180px;font-size:.88rem;background:var(--sheet)}
.process span.step b{color:var(--accent);margin-right:4px}
.process span.arr{color:var(--muted)}

/* speaking */
.part{display:flex;flex-direction:column;gap:10px}
.qline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.cue{border:1.5px dashed var(--ink);border-radius:10px;padding:16px}
.cue ul{margin:6px 0;padding-left:20px}
.notes{white-space:pre-line;font-size:.9rem;background:var(--mark);color:var(--mark-ink);padding:10px 12px;border-radius:6px;max-width:44ch}
.timer{font-family:var(--display);font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.phr{display:flex;flex-wrap:wrap;gap:8px}
.phr span{padding:4px 10px;border-radius:8px;background:var(--accent-soft);font-size:.88rem}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
details[open] summary{margin-bottom:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:14px 40px}
  .rail{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px}
  .rail .label{display:none}
  .unit-btn{min-width:160px;border-color:var(--line);background:var(--sheet)}
  .unit-btn.rev{min-width:120px;justify-content:center}
  .flash-area,.reading{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static;max-height:none}
  h1{font-size:1.6rem}
  .word{font-size:1.8rem}
}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" data-act="home" type="button"><b>Sổ Học IELTS</b><span>Band 4.0 – 5.0</span></button>
    <div class="spacer"></div>
    <span class="pill">Theo lộ trình Complete IELTS Bands 4–5</span>
  </div>
</header>

<div class="shell wrap">
  <nav class="rail" id="rail" aria-label="Các unit"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Units 1–5. Topics, grammar points, task types and word selections follow the map of
   Complete IELTS Bands 4–5. All passages, scripts, questions and model answers are original. */
window.UNITS = (window.UNITS || []).concat([
{
  id:"u1", title:"Great places to be", vi:"Những nơi đáng sống",
  focus:{reading:"Table completion · Note completion", listening:"Form completion", speaking:"Part 1: trả lời về bản thân, thêm chi tiết, nói thích/không thích", writing:"Task 1: biểu đồ tròn và biểu đồ cột, chọn ý chính, dùng số liệu chính xác", vocab:"percent / percentage · danh từ số nhiều", pron:"Sentence stress 1: nhấn vào từ trả lời câu hỏi hoặc mang thông tin mới"},
  vocab:[
    {w:"lifestyle",p:"n",ipa:"/ˈlaɪfstaɪl/",vi:"lối sống",ex:"Many young people in Hanoi have a busy lifestyle."},
    {w:"local",p:"n",ipa:"/ˈləʊkl/",vi:"người dân địa phương",ex:"Ask a local where to find the best phở."},
    {w:"crime rate",p:"n",ipa:"/kraɪm reɪt/",vi:"tỉ lệ tội phạm",ex:"The city has a low crime rate, so people feel safe at night."},
    {w:"diverse",p:"adj",ipa:"/daɪˈvɜːs/",vi:"đa dạng",ex:"Ho Chi Minh City has a diverse food scene."},
    {w:"environment",p:"n",ipa:"/ɪnˈvaɪrənmənt/",vi:"môi trường (sống, làm việc)",ex:"A friendly working environment makes people happier."},
    {w:"income",p:"n",ipa:"/ˈɪnkʌm/",vi:"thu nhập",ex:"Average income in the city has risen over the last ten years."},
    {w:"landscape",p:"n",ipa:"/ˈlændskeɪp/",vi:"phong cảnh",ex:"The landscape around Ninh Binh is famous for its limestone hills."},
    {w:"reputation",p:"n",ipa:"/ˌrepjuˈteɪʃn/",vi:"danh tiếng",ex:"Hoi An has a reputation for excellent tailors."},
    {w:"have access to",p:"phrase",ipa:"/hæv ˈækses tə/",vi:"được tiếp cận, được dùng",ex:"Everyone should have access to clean water."},
    {w:"consume",p:"v",ipa:"/kənˈsjuːm/",vi:"tiêu thụ",ex:"Big cities consume a lot of energy."}
  ],
  grammar:{
    title:"Present simple & Present continuous",
    rules:[
      {h:"Present simple",use:["Thói quen, việc lặp lại","Sự thật hiển nhiên","Lịch trình cố định"],form:"S + V(s/es) · S + don't/doesn't + V",ex:"Most locals cycle to work.",sig:"always, usually, often, every day"},
      {h:"Present continuous",use:["Việc đang xảy ra lúc nói","Việc tạm thời, xu hướng đang thay đổi","Kế hoạch đã sắp xếp"],form:"S + am/is/are + V-ing",ex:"More people are moving to the city these days.",sig:"now, at the moment, these days, this year"},
      {h:"Stative verbs",use:["Động từ trạng thái thường không dùng -ing","like, love, want, need, know, believe, own, seem"],form:"I know this city well. (không nói: I'm knowing)",ex:"She wants to live near the sea.",sig:"cảm xúc, suy nghĩ, sở hữu"}
    ],
    quiz:[
      {q:"She ___ to work by bus every day.",o:["goes","is going"],a:0,e:"'every day' là thói quen → present simple."},
      {q:"Be quiet! The baby ___.",o:["sleeps","is sleeping"],a:1,e:"Việc đang xảy ra ngay lúc nói."},
      {q:"I ___ the answer to this question.",o:["know","am knowing"],a:0,e:"'know' là stative verb."},
      {q:"These days, more and more people ___ to big cities.",o:["move","are moving"],a:1,e:"Xu hướng đang thay đổi → present continuous."},
      {q:"Water ___ at 100°C.",o:["boils","is boiling"],a:0,e:"Sự thật khoa học."},
      {q:"Look! It ___ again.",o:["rains","is raining"],a:1,e:"'Look!' báo hiệu việc đang diễn ra."},
      {q:"How often ___ you go to the park?",o:["do","are"],a:0,e:"Hỏi tần suất → do/does."},
      {q:"We ___ a party on Saturday. Everything is planned.",o:["have","are having"],a:1,e:"Kế hoạch đã sắp xếp."}
    ]
  },
  reading:{
    title:"The Friendliest City Survey", est:"khoảng 300 từ · 12 phút",
    paras:[
      "Every year, an online travel magazine asks its readers to score the cities they have visited. One of the most popular categories is friendliness: how welcoming are the people who live there? This year more than 20,000 travellers took part.",
      "First place went to Port Ellis, a harbour city of about 600,000 people. Readers said that locals often stop to help visitors who look lost, and many mentioned the free walking tours run by volunteers. The city also has a low crime rate, which makes tourists feel relaxed even late at night.",
      "In second place was Santa Lúcia, a small city in the mountains famous for its music festivals. Visitors praised its diverse food scene and said that shop owners were patient with people who did not speak the language. However, some readers complained that hotels were expensive during the festival season.",
      "Third place went to Kestrel Bay. It is not a big tourist destination, but readers loved its relaxed lifestyle and its beaches. ‘People invited me into their homes for dinner on my second day,’ one traveller wrote.",
      "The magazine's editor says the results show that friendliness matters more to travellers than famous buildings. ‘A museum is nice, but people remember how they were treated,’ she explains. Next year the magazine plans to add a new category: the best city for travellers who use wheelchairs."
    ],
    note:"Các thành phố trong bài là hư cấu, dùng để luyện tập.",
    quiz:[
      {t:"head",text:"Câu 1–5: Hoàn thành bảng. Điền KHÔNG QUÁ HAI TỪ VÀ/HOẶC MỘT CON SỐ."},
      {t:"gap",q:"Port Ellis · harbour city of about ___ people",a:["600,000","600000","600 000"],e:"Đoạn B."},
      {t:"gap",q:"Port Ellis · readers liked the free ___ run by volunteers",a:["walking tours","walking tour"],e:"Đoạn B."},
      {t:"gap",q:"Santa Lúcia · famous for its ___ festivals",a:["music"],e:"Đoạn C."},
      {t:"gap",q:"Santa Lúcia · problem: expensive ___ in the festival season",a:["hotels","hotel"],e:"Đoạn C."},
      {t:"gap",q:"Kestrel Bay · readers loved its relaxed lifestyle and its ___",a:["beaches"],e:"Đoạn D."},
      {t:"head",text:"Câu 6–7: Hoàn thành ghi chú. Điền MỘT TỪ."},
      {t:"gap",q:"The editor: friendliness matters more than famous ___",a:["buildings"],e:"Đoạn E."},
      {t:"gap",q:"New category next year: best city for travellers who use ___",a:["wheelchairs","wheelchair"],e:"Đoạn E."}
    ]
  },
  listening:{
    title:"Section 1 · Booking a holiday apartment",
    intro:"Một người gọi điện đặt căn hộ nghỉ dưỡng. Hoàn thành phiếu đặt phòng.",
    script:[
      ["A","Sunrise Holiday Apartments, Mark speaking. How can I help?"],

    prompt:"Nowadays, many young people take a year off between finishing school and starting university, in order to travel or work. What are the advantages and disadvantages of this?",
    plan:["Mở bài: paraphrase đề + nói bài sẽ bàn về ưu và nhược điểm","Thân 1: ưu điểm (trưởng thành hơn, kinh nghiệm làm việc, kiếm tiền) + ví dụ","Thân 2: nhược điểm (mất thói quen học, tốn tiền, chậm hơn bạn bè)","Kết bài: tóm tắt, có thể nêu ý kiến ngắn","Từ nối: Firstly, also, and, but, however, In conclusion"],
    model:"In many countries, it is becoming common for school leavers to take a gap year before they go to university. They often use this time to travel or to get a job. This essay will discuss the main advantages and disadvantages of this trend.\n\nThere are several advantages to taking a year off. Firstly, young people can become more independent and mature. When they travel alone or live away from home, they have to solve problems and manage their own money. Secondly, a gap year can give students useful work experience. For example, a student who works in a hotel for a year will improve their communication skills, and they can also save money for their studies.\n\nHowever, there are also some disadvantages. The biggest risk is that students may lose the habit of studying. After a year of working or travelling, it can be difficult to return to lectures and exams. In addition, travelling is expensive, so students from poorer families may not be able to afford it, and they might feel left behind. Finally, a gap year means that students will start their careers one year later than their friends.\n\nIn conclusion, a gap year can help young people to grow up and gain experience, but it can also make it harder to return to study and may be costly. I believe it is a good idea only if students have a clear plan for how they will use the time."
  },

  writing:{

    prompt:"Some people believe that modern technology has made our lives more complicated, not easier. To what extent do you agree or disagree?",
    plan:["Brainstorm: liệt kê ý cho cả hai phía, chọn phía bạn có nhiều ý hơn","Mở bài: paraphrase + nêu rõ mức độ đồng ý","Thân 1: công nghệ làm cuộc sống dễ hơn (giao tiếp, mua sắm, học tập)","Thân 2: nhưng cũng có mặt phức tạp (quá nhiều thông báo, mật khẩu)","Kết bài: nhắc lại quan điểm. Tránh lạc đề: mỗi câu phải trả lời câu hỏi"],
    model:"It is often said that modern technology, instead of making life simpler, has actually made it more complicated. Although I accept that technology can sometimes be stressful, I mostly disagree with this view, because in many important areas it has made our lives much easier.\n\nFirstly, technology has made communication fast and cheap. In the past, people had to write letters or pay a lot of money for international phone calls. Now, a student studying abroad can see and talk to their family every day using a free video app. Secondly, many everyday tasks take much less time than before. For example, we can pay bills, book train tickets and order food with a few taps on a phone, so we do not need to queue for hours.\n\nHowever, I agree that technology has created some new difficulties. Many people receive hundreds of messages and notifications every day, which makes it hard to concentrate. In addition, older people often find new devices and apps confusing, and they may feel left behind when services move online.\n\nIn my opinion, these problems are real but they can be solved. People can learn to turn off notifications, and families and governments can help older people to develop digital skills. The benefits of technology are much greater than the problems it causes.\n\nIn conclusion, while modern technology can sometimes be complicated, I believe that overall it has made our lives easier, especially in terms of communication and saving time."
  },

    prompt:"International tourism is growing quickly in many countries. Why do so many people want to travel abroad? What problems can tourism cause for local people?",
    plan:["Phân tích đề: có HAI câu hỏi, phải trả lời cả hai với độ dài gần bằng nhau","Mở bài: paraphrase + nói bài sẽ trả lời cả hai câu hỏi","Thân 1: lý do (rẻ hơn, mạng xã hội, trải nghiệm văn hoá)","Thân 2: vấn đề (giá cả tăng, đông đúc, ô nhiễm, mất văn hoá)","Kết bài: tóm tắt cả hai phần"],
    model:"In recent years, the number of people travelling to other countries for their holidays has increased dramatically. This essay will explain the main reasons for this and discuss some of the problems that tourism can create for local communities.\n\nThere are several reasons why people want to travel abroad. Firstly, international travel has become much cheaper. Low-cost airlines and online booking websites mean that even students can afford a short trip overseas. Secondly, social media plays an important role. When people see beautiful photos of beaches and mountains posted by their friends, they want to visit those places themselves. Finally, many travellers want to experience a different culture, try new food and learn about how other people live.\n\nHowever, tourism can also cause problems for the people who live in popular destinations. One problem is that prices often rise. When many tourists arrive, the cost of food and housing goes up, and local families may no longer be able to afford to live in the centre of their own city. Another problem is crowding and pollution. Famous sites can become so busy that residents avoid them, and tourists often leave rubbish behind. In addition, some traditional customs may be changed or lost as businesses try to attract visitors.\n\nIn conclusion, people travel abroad because it is cheaper and easier than before and because they want new experiences. Although tourism brings money, it can also increase prices, create crowds and damage local culture, so it needs to be managed carefully."
  },

    p1sample:{q:"What is a popular tourist attraction in your country?",a:"Well, I'd say Ha Long Bay is probably the most famous one. It has thousands of huge limestone islands, and the scenery is breathtaking. Most visitors take a boat cruise and stay overnight on the bay."},
    cue:{t:"Describe a tourist attraction you have visited.",pts:["where it is","when you went there","what you saw there"],end:"and explain how you felt about it."},
    p2sample:"The tourist attraction I'd like to describe is the Imperial City in Hue. I went there last summer with my university classmates as part of a history trip. It's a huge, walled complex in the centre of the city, which was home to the Nguyen emperors in the nineteenth century. When we arrived, the first thing I saw was the impressive main gate, called Ngo Mon. Inside, there were ancient palaces, temples and beautiful gardens with lotus ponds. Some parts were damaged during the war, but many buildings have been carefully restored. Let me think, what else? Oh yes, we also watched a traditional music performance, which was really memorable. To be honest, I felt quite proud of our history, and also a little sad, because so much was lost. I'd definitely like to go back.",

    paras:[
      "In some of the driest places on Earth, it almost never rains. Yet every morning, thick fog rolls in from the ocean and covers the hills. For centuries, people living in these areas could only watch as this valuable source of water disappeared when the sun came out.",
      "Today, a simple technology is changing this. Fog nets are large sheets of fine plastic mesh, often around 40 square metres in size, which are stretched between two poles on a hillside. As the fog passes through the net, tiny drops of water stick to the mesh. The drops join together, run down into a pipe at the bottom and are collected in a tank.",
      "The amount of water collected depends on the weather and the location, but a single large net can produce several hundred litres on a foggy day. This may not sound like much, but in a village where women once walked for hours to fetch water, it makes an enormous difference.",
      "Fog nets have several advantages. They need no electricity, they are cheap to build, and local people can repair them easily. However, they only work in places with regular fog and wind, and the water often needs to be cleaned before people can drink it.",
      "Projects using fog nets have now been set up in a number of countries, from South America to Africa. In one village, the water has been used not only for drinking and hygiene but also to grow vegetables, giving families a new source of food and income."

<script>
const UNITS = window.UNITS || [];

/* ============ STATE & STORAGE ============ */
const KEY = "ielts45-progress-v2";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
const P = Object.assign({known:{},scores:{},drafts:{},spoke:{}}, load());
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }

const TABS = [["vocab","Từ vựng"],["grammar","Ngữ pháp"],["reading","Reading"],["listening","Listening"],["writing","Writing"],["speaking","Speaking"]];
const FOCUS = {vocab:"vocab", grammar:null, reading:"reading", listening:"listening", writing:"writing", speaking:"speaking"};
const S = {view:"home", u:0, r:0, tab:"vocab", card:0, flipped:false, vq:null, rq:null, timer:null};
const QUIZ = {};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const shuffleOpts = q => { const idx = shuffle(q.o.map((_,i)=>i)); return Object.assign({}, q, {o: idx.map(i=>q.o[i]), a: idx.indexOf(q.a)}); };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,2600); }
function wordCount(t){ return (t.trim().match(/\S+/g)||[]).length; }

function done(u, tab){
  const unit = UNITS[u], id = unit.id;
  if(tab==="vocab") return unit.vocab.every(v => P.known[id+":"+v.w]);
  if(tab==="writing") return wordCount(P.drafts[id]||"") >= unit.writing.min;
  if(tab==="speaking") return !!P.spoke[id];
  const sc = P.scores[id+":"+tab]; return sc != null && sc >= 0.7;
}
function unitPct(u){ return TABS.filter(t => done(u,t[0])).length / TABS.length; }

/* ============ SPEECH ============ */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(i){
  const gb = voices.filter(v => /en-GB/i.test(v.lang)); const pool = gb.length ? gb : voices;
  return pool.length ? pool[i % pool.length] : null;
}
function speak(text, opt={}){
  if(!("speechSynthesis" in window)){ toast("Trình duyệt này không hỗ trợ đọc giọng nói."); return null; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB"; u.rate = opt.rate || Number(($("#rate")||{}).value || 0.9);
  const v = pickVoice(opt.voice||0); if(v) u.voice = v;
  if(opt.pitch) u.pitch = opt.pitch;
  if(opt.onend) u.onend = opt.onend;
  speechSynthesis.speak(u); return u;
}
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll(".script .now").forEach(e=>e.classList.remove("now")); }

/* ============ RENDER: shell ============ */
function renderRail(){
  let h = '<div class="label">10 unit · Complete IELTS 4–5</div>';
  UNITS.forEach((u,i) => {
    h += `<button class="unit-btn" type="button" data-act="unit" data-u="${i}" aria-current="${S.view==='unit'&&S.u===i}">
      <span><b>${i+1}</b> · ${esc(u.title)}</span><small>${esc(u.vi)}</small>
      <span class="bar"><i style="width:${Math.round(unitPct(i)*100)}%"></i></span></button>`;
    if(i%2===1){ const r=(i-1)/2, sc=P.scores["review:"+r];
      h += `<button class="unit-btn rev" type="button" data-act="review" data-r="${r}" aria-current="${S.view==='review'&&S.r===r}">↻ Ôn tập Unit ${i}–${i+1}${sc!=null?` · ${Math.round(sc*100)}%`:""}</button>`; }
  });
  $("#rail").innerHTML = h;
}

function renderHome(){
  const reviews = [0,1,2,3,4].filter(r => UNITS[r*2+1]);

/* ============ QUIZ ENGINE ============ */
// item types: mc (default) {q,o,a,e} · gap {q,a:[accepted],e} · pick {q,o,a:[idx],e} · head {text,fig}
const norm = s => String(s).toLowerCase().trim().replace(/[’']/g,"'").replace(/[£$]/g,"").replace(/(\d),(\d)/g,"$1$2").replace(/\s+/g," ").replace(/[.,;!?]+$/,"");
function quizHTML(id, items){
  QUIZ[id] = items; let n = 0;
  const body = items.map((q,i) => {
    if(q.t==="head") return `<p class="qhead">${esc(q.text)}</p>${q.fig&&FIGS[q.fig]?`<div class="fig">${FIGS[q.fig]()}</div>`:""}`;
    n++;
    const ex = q.e ? `<p class="explain" hidden>${esc(q.e)}</p>` : "";
    if(q.t==="gap"){
      const parts = q.q.split("___"), inp = `<input class="gap" id="${esc(id)}-${i}" autocomplete="off" spellcheck="false" aria-label="Câu ${n}">`;
      return `<div class="q" data-i="${i}"><div class="gapline"><span class="num">${n}</span>${esc(parts[0])}${inp}${esc(parts[1]||"")}<span class="fix"></span></div>${ex}</div>`;
    }
    const multi = q.t==="pick", long = q.o.some(o => o.length > 22);
    if(!multi && q.o.length > 4) return `<div class="q" data-i="${i}"><p><span class="num">${n}</span>${esc(q.q)}</p>
      <div class="row"><select class="pick-sel" aria-label="Câu ${n}"><option value="">Chọn…</option>${q.o.map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join("")}</select><span class="fix"></span></div>${ex}</div>`;
    return `<div class="q" data-i="${i}"><p><span class="num">${n}</span>${esc(q.q)}</p>
      <div class="opts ${long?'col':''}">${q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${esc(id)}-${i}" value="${j}"> ${esc(o)}</label>`).join("")}</div>${ex}</div>`;
  }).join("");
  return `<form class="quiz" data-id="${esc(id)}">${body}
    <div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Chấm điểm</button><button class="btn" type="reset">Làm lại</button><span class="qscore"></span>
    ${P.scores[id]!=null?`<span class="muted small">Cao nhất: ${Math.round(P.scores[id]*100)}%</span>`:""}</div></form>`;
}
function gradeQuiz(f){
  const items = QUIZ[f.dataset.id]; let got = 0, total = 0;
  f.querySelectorAll(".q").forEach(el => {
    const q = items[+el.dataset.i], ex = el.querySelector(".explain"); if(ex) ex.hidden = false;
    if(q.t==="gap"){
      total++; const inp = el.querySelector("input"), v = norm(inp.value);
      const ok = !!v && q.a.some(a => norm(a)===v || norm(a).replace(/\s/g,"")===v.replace(/\s/g,""));
      inp.classList.toggle("right", ok); inp.classList.toggle("wrong", !ok);
      const fx = el.querySelector(".fix"); fx.className = "fix " + (ok?"ok":"no"); fx.textContent = ok ? "✓" : "→ " + q.a[0];
      if(ok) got++; return;
    }
    const sel = el.querySelector("select");
    if(sel){
      total++; const ok = sel.value!=="" && +sel.value===q.a; if(ok) got++;
      sel.classList.toggle("right", ok); sel.classList.toggle("wrong", !ok);
      const fx = el.querySelector(".fix"); fx.className = "fix " + (ok?"ok":"no"); fx.textContent = ok ? "✓" : "→ " + q.o[q.a];
      return;
    }
    const picked = [...el.querySelectorAll("input:checked")].map(x => +x.value);
    const right = q.t==="pick" ? q.a : [q.a];
    el.querySelectorAll(".opt").forEach((o,j) => { o.classList.toggle("right", right.includes(j)); o.classList.toggle("wrong", picked.includes(j) && !right.includes(j)); });
    if(q.t==="pick"){ total += q.a.length; const hit = picked.filter(p => q.a.includes(p)).length, extra = picked.length - hit; got += Math.max(0, hit - extra); }
    else { total++; if(picked[0]===q.a) got++; }
  });
  return [got, total];
}
function scoreHTML(r, n){ return `<span class="score ${r/n>=.7?'good':'low'}">${r}/${n}</span> <span class="muted">${r/n>=.7?'Tốt lắm!':'Xem giải thích rồi làm lại nhé.'}</span>`; }

const PALETTE = ["var(--accent)","var(--ink)","var(--c3)","var(--mark)","var(--muted)"];
function legend(names, y){ let s="", x=10; names.forEach((n,j)=>{ s+=`<rect x="${x}" y="${y}" width="12" height="12" fill="${PALETTE[j]}" rx="2"/><text x="${x+17}" y="${y+10}">${esc(n)}</text>`; x += 34 + n.length*7; }); return s; }
function barSVG(c){
  const W=520,H=260,L=44,B=40,T=14,max=c.max,cw=(W-L-10)/c.cats.length,ns=c.series.length,bw=(cw-24)/ns;
  let s=`<svg viewBox="0 0 ${W} ${H+(ns>1?24:0)}" role="img" aria-label="${esc(c.title)}">`;
  for(let v=0; v<=max; v+=c.step){ const y=H-B-(v/max)*(H-B-T); s+=`<line class="grid" x1="${L}" x2="${W-10}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${v}</text>`; }
  c.cats.forEach((cat,i)=>{ const x0=L+i*cw+12;
    c.series.forEach(([n,vals],j)=>{ const h=(vals[i]/max)*(H-B-T); s+=`<rect x="${x0+j*bw}" y="${H-B-h}" width="${bw-4}" height="${h}" fill="${PALETTE[j]}" rx="2"><title>${esc(n)} · ${esc(cat)}: ${vals[i]}</title></rect>`; });
    s+=`<text x="${x0+(cw-24)/2}" y="${H-B+18}" text-anchor="middle">${esc(cat)}</text>`; });
  if(ns>1) s+=legend(c.series.map(x=>x[0]), H);
  return s+"</svg>";
}
function lineSVG(c){
  const W=520,H=260,L=44,B=40,T=14,R=24,max=c.max,dx=(W-L-R)/(c.cats.length-1);
  let s=`<svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="${esc(c.title)}">`;
  for(let v=0; v<=max; v+=c.step){ const y=H-B-(v/max)*(H-B-T); s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${v}</text>`; }
  c.cats.forEach((cat,i)=>{ s+=`<text x="${L+i*dx}" y="${H-B+18}" text-anchor="middle">${esc(cat)}</text>`; });
  c.series.forEach(([n,vals],j)=>{ const pts=vals.map((v,i)=>`${L+i*dx},${H-B-(v/max)*(H-B-T)}`);
    s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="${PALETTE[j]}" stroke-width="2.5"/>`;
    vals.forEach((v,i)=>{ s+=`<circle cx="${L+i*dx}" cy="${H-B-(v/max)*(H-B-T)}" r="3.5" fill="${PALETTE[j]}"><title>${esc(n)} ${esc(c.cats[i])}: ${v}</title></circle>`; }); });
  return s+legend(c.series.map(x=>x[0]), H)+"</svg>";
}
function pieSVG(c){
  const cx=110, cy=110, r=95, tot=c.data.reduce((a,d)=>a+d[1],0); let a0=-Math.PI/2, s=`<svg viewBox="0 0 420 225" role="img" aria-label="${esc(c.title)}">`;
  c.data.forEach(([n,v],j)=>{ const a1=a0+v/tot*2*Math.PI, big=a1-a0>Math.PI?1:0;
    s+=`<path d="M${cx},${cy} L${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)} A${r},${r} 0 ${big} 1 ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)} Z" fill="${PALETTE[j%5]}" stroke="var(--sheet)" stroke-width="2"><title>${esc(n)}: ${v}%</title></path>`;
    s+=`<rect x="235" y="${30+j*34}" width="14" height="14" rx="2" fill="${PALETTE[j%5]}"/><text x="256" y="${42+j*34}">${esc(n)} · ${v}%</text>`; a0=a1; });
  return s+"</svg>";
}
function chartHTML(c){
  let inner = "";
  if(c.type==="bar") inner = barSVG(c);
  else if(c.type==="line") inner = lineSVG(c);
  else if(c.type==="pie") inner = pieSVG(c);
  else if(c.type==="table") inner = `<div class="tablewrap"><table class="dtable"><thead><tr>${c.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<td><b>${esc(x)}</b></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  else if(c.type==="process") inner = `<div class="process">${c.steps.map((s,i)=>`<span class="step"><b>${i+1}</b>${esc(s)}</span>${i<c.steps.length-1?'<span class="arr">→</span>':''}`).join("")}</div>`;
  return `<div class="chart"><h4>${esc(c.title)}</h4>${inner}</div>`;
}

    <div class="sheet stack"><div class="row" style="justify-content:space-between"><label for="draft"><h3>Bài viết của bạn</h3></label>
      <span class="wc ${n>=w.min?'ok':'low'}" id="wc">${n} / ${w.min} từ</span></div>
      <textarea id="draft" placeholder="Bắt đầu viết ở đây. Bài được tự động lưu trên trình duyệt này.">${esc(txt)}</textarea>
      <div class="check"><span class="eyebrow">Tự kiểm tra trước khi nộp</span>
        ${checks.map((c,i)=>`<label><input type="checkbox" id="ck${u.id}${i}"> ${c}</label>`).join("")}</div></div>
    <details class="sheet"><summary>Xem bài mẫu (khoảng band 6)</summary><div class="model">${esc(w.model)}</div>
      <p class="muted small" style="margin-top:8px">${wordCount(w.model)} từ. Hãy viết bài của bạn trước, sau đó so sánh cách chia đoạn và từ nối.</p></details></div>`;
}

function vSpeaking(u){
  const s = u.speaking, line = q => `<div class="qline"><span>${esc(q)}</span><button class="btn small" type="button" data-act="say" data-text="${esc(q)}" aria-label="Nghe câu hỏi">🔊</button></div>`;
  const sample = (q,a) => `<details><summary>Câu trả lời mẫu: “${esc(q)}”</summary><p>${esc(a)}</p><button class="btn small" type="button" data-act="say" data-text="${esc(a)}" style="margin-top:8px">🔊 Nghe mẫu</button></details>`;
  return `<div class="stack">
    <div class="sheet"><span class="eyebrow">Mẹo của unit</span><p style="margin-top:6px">${esc(s.tip)}</p></div>
    <div class="sheet part"><span class="eyebrow">Part 1 · 4–5 phút · câu hỏi về bản thân</span>${s.p1.map(line).join("")}${sample(s.p1sample.q, s.p1sample.a)}</div>
    <div class="sheet part"><span class="eyebrow">Part 2 · 1 phút chuẩn bị · nói 1–2 phút</span>
      <div class="cue"><h3>${esc(s.cue.t)}</h3><p>You should say:</p><ul>${s.cue.pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p>${esc(s.cue.end)}</p></div>
      <div class="row"><span class="timer" id="timer">1:00</span><button class="btn primary" type="button" data-act="prep">Chuẩn bị (1 phút)</button><button class="btn" type="button" data-act="talk">Bắt đầu nói (2 phút)</button><button class="btn" type="button" data-act="tstop">Dừng</button></div>
      ${s.notes?`<details><summary>Ghi chú mẫu trong 1 phút</summary><p class="notes">${esc(s.notes)}</p></details>`:""}
      <details><summary>Bài nói mẫu</summary><p>${esc(s.p2sample)}</p><button class="btn small" type="button" data-act="say" data-text="${esc(s.p2sample)}" style="margin-top:8px">🔊 Nghe mẫu</button></details></div>
    <div class="sheet part"><span class="eyebrow">Part 3 · 4–5 phút · thảo luận</span>${s.p3.map(line).join("")}${s.p3sample?sample(s.p3sample.q, s.p3sample.a):""}</div>
    <div class="sheet part"><span class="eyebrow">Cụm từ hữu ích</span><div class="phr">${s.phrases.map(p=>`<span>${esc(p)}</span>`).join("")}</div></div>
    <div class="row"><button class="btn ${P.spoke[u.id]?'':'primary'}" type="button" data-act="spoke">${P.spoke[u.id]?'Bỏ đánh dấu':'✓ Tôi đã luyện nói xong unit này'}</button></div></div>`;
}
function runTimer(sec){
  clearInterval(S.timer); let t = sec; const el = $("#timer");
  const show = () => { if(el) el.textContent = Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
  show(); S.timer = setInterval(() => { t--; show(); if(t<=0){ clearInterval(S.timer); toast(sec===60?"Hết giờ chuẩn bị. Bắt đầu nói!":"Hết 2 phút. Bạn đã hoàn thành Part 2."); } }, 1000);
}

/* ============ REVIEW (after every two units, like the book) ============ */
function renderReview(){
  const a = UNITS[S.r*2], b = UNITS[S.r*2+1];
  if(!S.rq || S.rq.r !== S.r){
    const vocab = vocabQuestions(a.vocab.concat(b.vocab), 8);
    const gram = shuffle(a.grammar.quiz).slice(0,4).concat(shuffle(b.grammar.quiz).slice(0,4)).map(shuffleOpts);
    S.rq = {r:S.r, items:[{t:"head",text:"Phần 1: Từ vựng Unit "+(S.r*2+1)+"–"+(S.r*2+2)}, ...vocab, {t:"head",text:"Phần 2: Ngữ pháp · "+a.grammar.title+" / "+b.grammar.title}, ...gram]};
  }
  return `<span class="eyebrow">Vocabulary and grammar review</span><h1>Ôn tập Unit ${S.r*2+1}–${S.r*2+2}</h1>
    <p class="muted" style="margin:8px 0 18px;max-width:62ch">Câu hỏi được trộn ngẫu nhiên từ hai unit ${esc(a.title)} và ${esc(b.title)}. Bấm “Đổi đề” để làm một bộ câu hỏi khác.</p>
    <div class="sheet"><div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn small" type="button" data-act="newrq">Đổi đề</button></div>${quizHTML("review:"+S.r, S.rq.items)}</div>`;
}

/* ============ EVENTS ============ */
function render(){
  stopSpeech(); clearInterval(S.timer); renderRail();
  $("#main").innerHTML = S.view==="home" ? renderHome() : S.view==="review" ? renderReview() : renderUnit();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, u = UNITS[S.u];
  if(a==="home"){ S.view="home"; render(); }
  else if(a==="unit"){ S.view="unit"; S.u=+b.dataset.u; S.tab="vocab"; S.card=0; S.flipped=false; S.vq=null; render(); window.scrollTo(0,0); }
  else if(a==="review"){ S.view="review"; S.r=+b.dataset.r; S.rq=null; render(); window.scrollTo(0,0); }
  else if(a==="newrq"){ S.rq=null; render(); }
  else if(a==="tab"){ S.tab=b.dataset.tab; render(); }
  else if(a==="flip"){ S.flipped=!S.flipped; b.classList.toggle("flipped", S.flipped); }
  else if(a==="card"){ S.card=(S.card+ +b.dataset.d+u.vocab.length)%u.vocab.length; S.flipped=false; render(); }
  else if(a==="goto"){ S.card=+b.dataset.i; S.flipped=false; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else if(a==="known"){ const k=b.dataset.k; if(P.known[k]) delete P.known[k]; else { P.known[k]=true; S.card=(S.card+1)%u.vocab.length; S.flipped=false; } save(); render(); }
  else if(a==="newvq"){ S.vq=null; render(); }
  else if(a==="say"){ stopSpeech(); speak(b.dataset.text); }
  else if(a==="play"){ playDialogue(); }
  else if(a==="stop"){ stopSpeech(); }
  else if(a==="prep"){ runTimer(60); }
  else if(a==="talk"){ runTimer(120); }
  else if(a==="tstop"){ clearInterval(S.timer); }
  else if(a==="spoke"){ P.spoke[u.id]=!P.spoke[u.id]; save(); render(); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form.quiz"); if(!f) return; e.preventDefault();
  const [got, total] = gradeQuiz(f);
  f.querySelector(".qscore").innerHTML = scoreHTML(got, total);
  if(!f.dataset.id.endsWith("vocabquiz")) recordScore(f.dataset.id, got/total);
});
document.addEventListener("reset", e => { const f=e.target.closest("form.quiz"); if(!f) return;
  setTimeout(()=>{ f.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong")); f.querySelectorAll(".gap,.pick-sel").forEach(o=>o.classList.remove("right","wrong"));
    f.querySelectorAll(".fix").forEach(x=>{x.textContent="";x.className="fix";}); f.querySelectorAll(".explain").forEach(x=>x.hidden=true); f.querySelector(".qscore").innerHTML=""; }); });

let draftT;
document.addEventListener("input", e => {
  if(e.target.id !== "draft") return;
  const u = UNITS[S.u], n = wordCount(e.target.value), wc = $("#wc");
  wc.textContent = `${n} / ${u.writing.min} từ`; wc.className = "wc " + (n>=u.writing.min?"ok":"low");
  clearTimeout(draftT); draftT = setTimeout(()=>{ P.drafts[u.id]=e.target.value; save(); renderRail(); }, 500);
});

render();
</script>

</body>
</html>
