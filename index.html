<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Học IELTS</title>
<meta name="description" content="Website tự học IELTS band 4.0–5.0 theo 10 unit của Complete IELTS Bands 4–5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem("ielts45-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" data-act="home" type="button"><b>Sổ Học IELTS</b><span>Band 4.0 – 5.0</span></button>
    <div class="spacer"></div>
    <span class="pill">Theo lộ trình Complete IELTS Bands 4–5</span>
    <div class="clock" id="clock" role="timer" aria-live="off"><span class="clk-ic" id="clkic" aria-hidden="true"></span><span class="clk-tx"><b id="clktime">--:--</b><span id="clkday"></span></span></div>
    <button class="btn small themebtn" type="button" data-act="theme" id="themebtn" aria-label="Chuyển chế độ sáng/tối"><span class="th-ic" aria-hidden="true"></span><span class="th-tx">Tối</span></button>
    <button class="btn small aibtn" type="button" data-act="ai" id="aibtn" aria-label="Cài đặt chấm bài bằng AI"><span class="ai-dot" aria-hidden="true"></span>🤖<span class="hd-tx"> Chấm AI</span></button>
    <button class="btn small" type="button" data-act="voice" aria-label="Chọn giọng đọc">🔊<span class="hd-tx"> Giọng đọc</span></button>
  </div>
</header>

<div class="shell wrap">
  <nav class="rail" id="rail" aria-label="Các unit"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="data/units-1-5.js"></script>
<script src="data/units-6-10.js"></script>
  <script src="data/grammar-bank.js"></script>
<script src="data/lesson.js"></script>
<script src="data/extra-1-5.js"></script>
<script src="data/extra-6-10.js"></script>
<script src="data/book-like.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
